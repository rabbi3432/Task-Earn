name: Task Earn Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.taskearn .

      - name: Configure Android flavors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          flavors = '''
          flavorDimensions += "app"
          productFlavors {
              create("user") {
                  dimension = "app"
                  applicationId = "com.taskearn.user"
              }
              create("admin") {
                  dimension = "app"
                  applicationId = "com.taskearn.admin"
              }
          }
          '''
          if 'create("user")' not in text:
              text = text.replace('    defaultConfig {', flavors + '\n    defaultConfig {', 1)
          if 'com.startapp:inapp-sdk' not in text:\n              text = text.replace('dependencies {', 'dependencies {\\n    implementation(\"com.startapp:inapp-sdk:5.+\")', 1)\n          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:label="task_earn"', 'android:label="@string/app_name"')
          if 'com.startapp.sdk.APPLICATION_ID' not in text:\n              text = text.replace('<application', '<application\\n        android:usesCleartextTraffic=\"true\"', 1)\n              text = text.replace('</application>', '    <meta-data android:name=\"com.startapp.sdk.APPLICATION_ID\" android:value=\"208202718\" />\\n    </application>', 1)\n          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1
              )
          if 'android.intent.action.VIEW' not in text:
              marker = '        </activity>'
              deep_link = '''        <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="taskearn" android:host="register" />
              </intent-filter>
          '''
              text = text.replace(marker, deep_link + marker, 1)
          manifest.write_text(text)

          for flavor, name in [("user", "Task Earn"), ("admin", "Task Earn Admin")]:
              values = Path(f"android/app/src/{flavor}/res/values")
              values.mkdir(parents=True, exist_ok=True)
              (values / "strings.xml").write_text(
                  f'<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">{name}</string></resources>\n'
              )
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        run: flutter build apk --release --flavor user --target lib/main.dart

      - name: Build Admin APK
        run: flutter build apk --release --flavor admin --target lib/admin_main.dart

      - name: Collect APKs
        run: |
          cp build/app/outputs/flutter-apk/app-user-release.apk task-earn-user.apk
          cp build/app/outputs/flutter-apk/app-admin-release.apk task-earn-admin.apk
          ls -lh task-earn-*.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-user-apk
          path: task-earn-user.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-admin-apk
          path: task-earn-admin.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Task Earn Latest APKs
          prerelease: true
          make_latest: false
          files: |
            task-earn-user.apk
            task-earn-admin.apk
