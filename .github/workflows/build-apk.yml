name: Task Earn Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-earn-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Generate Android project
        run: flutter create --platforms=android --org com.taskearn .

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings=Path("android/settings.gradle.kts")
          s=settings.read_text()
          s=re.sub(r'id\("com\.android\.application"\)\s+version\s+"[^"]+"','id("com.android.application") version "9.1.1"',s)
          s=s.replace('id("org.jetbrains.kotlin.android") version "2.1.20"', 'id("org.jetbrains.kotlin.android") version "2.2.10"')
          settings.write_text(s)
          wrapper=Path("android/gradle/wrapper/gradle-wrapper.properties")
          s=wrapper.read_text()
          s=re.sub(r'gradle-[0-9.]+-(?:bin|all)\.zip','gradle-9.3.1-bin.zip',s)
          wrapper.write_text(s)
          gradle=Path("android/app/build.gradle.kts")
          s=gradle.read_text().replace("compileSdk = flutter.compileSdkVersion","compileSdk = 37")
          if 'create("user")' not in s:
            s=s.replace('    defaultConfig {','''    flavorDimensions += "app"
              productFlavors {
                  create("user") {
                      dimension = "app"
                      applicationId = "com.taskearn.user"
                  }
                  create("admin") {
                      dimension = "app"
                      applicationId = "com.taskearn.admin"
                  }
              }

              defaultConfig {''',1)
          if "isMinifyEnabled = false" not in s:
            s=s.replace('    defaultConfig {','''    buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }

              defaultConfig {''',1)
          gradle.write_text(s)
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          s=manifest.read_text()
          s=s.replace('    <uses-permission android:name="android.permission.AD_ID" />\n','')
          manifest.write_text(s)
          for flavor,name in [("user","Task Earn"),("admin","Task Earn Admin")]:
            p=Path(f"android/app/src/{flavor}/res/values"); p.mkdir(parents=True,exist_ok=True)
            (p/"strings.xml").write_text(f'<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">{name}</string></resources>\n')
          PY
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build User APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew app:assembleUserRelease --no-daemon --stacktrace
          cd ..
          USER_APK=$(find android/app/build/outputs/apk -type f -name '*user*release*.apk' | head -n1)
          test -n "$USER_APK"
          cp "$USER_APK" /tmp/task-earn-user.apk

      - name: Build Admin APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew app:assembleAdminRelease --no-daemon --stacktrace
          cd ..
          ADMIN_APK=$(find android/app/build/outputs/apk -type f -name '*admin*release*.apk' | head -n1)
          test -n "$ADMIN_APK"
          cp "$ADMIN_APK" /tmp/task-earn-admin.apk

      - name: Collect APKs
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          cp /tmp/task-earn-user.apk "task-earn-$VERSION.apk"
          cp /tmp/task-earn-admin.apk "task-earn-admin-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-${{ env.VERSION }}
          path: task-earn-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-admin-${{ env.VERSION }}
          path: task-earn-admin-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Task Earn Latest APKs
          prerelease: true
          make_latest: false
          files: |
            task-earn-${{ env.VERSION }}.apk
            task-earn-admin-${{ env.VERSION }}.apk
