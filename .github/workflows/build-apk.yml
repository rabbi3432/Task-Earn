name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform if missing
        run: flutter create --platforms=android --org com.taskearn .

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build User APK
        run: |
          flutter build apk --release --target lib/main.dart
          cp build/app/outputs/flutter-apk/app-release.apk task-earn-user.apk

      - name: Build Admin APK
        run: |
          flutter build apk --release --target lib/admin_main.dart
          cp build/app/outputs/flutter-apk/app-release.apk task-earn-admin.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-user-apk
          path: task-earn-user.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-admin-apk
          path: task-earn-admin.apk
          if-no-files-found: error

# Build trigger check


      - name: Publish APKs for direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Task Earn Latest APKs
          prerelease: true
          make_latest: false
          files: |
            task-earn-user.apk
            task-earn-admin.apk
          overwrite_files: true
